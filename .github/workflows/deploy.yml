# 构建并发布到 GitHub Pages
# - 每次推送到 main / 当前工作分支都会重新构建（同步最新开奖 → 构建 → 部署）
# - 每天 17:30 UTC（北京时间 01:30）自动跑一次，接住源仓库的定时同步结果
name: Deploy Draw Lab

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest draws from Number-selection-tool
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run data:sync

      - name: Smoke test
        run: npm run smoke

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
